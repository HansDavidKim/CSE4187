[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-sim"
version = "0.4.0"
description = "Intervention-aware e-commerce panel simulator"
requires-python = ">=3.10"
dependencies = [
  "gcastle==1.0.4",
  "kagglehub>=0.3.13",
  "numpy>=1.24",
  "pandas==2.3.3",
  "scikit-learn>=1.3",
  "torch>=2.0",
  "scipy>=1.7.3",
  "joblib>=1.4.0",
  "threadpoolctl>=3.5.0",
  "pyarrow>=10",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.6"]
analysis = ["matplotlib>=3.6", "pyarrow>=10"]

[project.scripts]
ecommerce-sim = "cli:main"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"simulate.v4" = ["config/*.yaml", "config/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

